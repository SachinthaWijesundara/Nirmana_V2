[project]
name = "nirmana-backend"
version = "0.1.0"
description = "Nirmana backend: accounts, projects and the P1/P2 twin agents"
entry-point = "main.jac"
kind = "fullstack"
# Jac 0.34.23 is what JacHammer runs. byLLM and the web client are built into Jac 0.34
# (import from jaclang.byllm.lib); do not add the old byllm or jac-client PyPI packages.
jac-version = "0.34.23"

[dependencies.npm]
react = "^18.2.0"
react-dom = "^18.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
"@tanstack/react-form" = "^1.33.0"
zod = "^4.3.6"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.2.1"
typescript = "^5.3.3"
"@types/react" = "^18.2.0"
"@types/react-dom" = "^18.2.0"

[serve]
base_route_app = "app"

[jacpack]
name = "Nirmana_V2"
description = "Jac IDE snapshot for Nirmana_V2"

[jachammer]
project_id = "prj_c3deb3c330f4431f9022c835c3a2315a"
