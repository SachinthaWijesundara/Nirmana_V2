[project]
name = "nirmana-p2-agents"
version = "0.1.0"
description = "Nirmana P2: Intake, Payment Guard and Delay Detector agents (Jac walkers)"
entry-point = "agents/intake.jac"

# Set the real model before the first live `by llm` call; tests use MockLLM.
# [plugins.byllm.model]
# default_model = "claude-sonnet-4-6"

[jacpack]
name = 'Nirmana_V2'
description = 'Jac IDE snapshot for Nirmana_V2'

[jachammer]
project_id = "prj_c3deb3c330f4431f9022c835c3a2315a"

# The web/ client code is dynamic JS interop (browser globals, JSON data), which the checker types as Any.
# Suppress only the Any-related codes; every other error still fails CI.
[check]
suppress = ["E1001", "E1002", "E1030", "E1031", "E1032", "E1040", "E1053", "E1054", "E1055", "E1100", "E1103", "E1110", "E1111"]
