[project]
name = "nirmana-backend"
version = "0.1.0"
description = "Nirmana backend: accounts, projects and the P1/P2 twin agents"
entry-point = "main.jac"
kind = "fullstack"
# The code is written and tested for Jac 0.16.7 (byllm 0.6.19 only works with Jac 0.16).
# Without this pin, JacHammer uses its newer default Jac and byllm fails to load.
jac-version = "0.16.7"

[dependencies]
byllm = "==0.6.19"
jac-client = "==0.3.25"

[dependencies.npm]
react = "^18.2.0"
react-dom = "^18.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
react-hook-form = "^7.71.0"
zod = "^4.3.6"
"@hookform/resolvers" = "^5.2.2"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.2.1"
typescript = "^5.3.3"
"@types/react" = "^18.2.0"
"@types/react-dom" = "^18.2.0"

[serve]
base_route_app = "app"

[plugins.client]

[jacpack]
name = "Nirmana_V2"
description = "Jac IDE snapshot for Nirmana_V2"

[jachammer]
project_id = "prj_c3deb3c330f4431f9022c835c3a2315a"
