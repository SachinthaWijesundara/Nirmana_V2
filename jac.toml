[project]
name = "nirmana"
version = "0.1.0"
description = "Nirmana: construction digital twin for a homeowner abroad (Intake, Payment Guard, Delay Detector + D1 dashboard)"
entry-point = "main.jac"
kind = "fullstack"

[dependencies.npm]
react = "^18.2.0"
react-dom = "^18.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
react-hook-form = "^7.71.0"
zod = "^4.3.6"
"@hookform/resolvers" = "^5.2.2"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.2.1"
typescript = "^5.3.3"
"@types/react" = "^18.2.0"
"@types/react-dom" = "^18.2.0"

[dev-dependencies]
watchdog = ">=3.0.0"

[serve]
base_route_app = "app"

[plugins.client]

# Set the real model before the first live `by llm` call; tests and the offline demo use MockLLM (GEDARA_LLM=mock).
# [plugins.byllm.model]
# default_model = "claude-sonnet-4-6"
